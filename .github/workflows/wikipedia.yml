name: Wikipedia index

# Keeps the wiki band current by delta rather than by republishing ~95 MB a day.
#
# The band is ranked by pageviews and byte-budgeted, so its floor sits at one or two views a day — where a
# single view either way reorders a row. Measured against the 2026-09-24 sample and a resampled day after
# it: an article's exact standing moved for 68–96% of rows, but a *level* of it moved for 2–8%, and the
# band itself reshuffled by 0.2–10%. So the store keeps a decayed score and the index ships its octave:
# a delta then carries a few percent of a band rather than all of it.
#
# The chain restarts weekly and on a cold cache — a delta can only be applied to the base it was built
# on, so a run with no marker and no base behind it rebuilds instead.

on:
  schedule:
    # Daily. The pageview dumps lag a day, so the sample wants a complete day behind it.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Pageview sample date (YYYY-MM-DD, blank = yesterday)"
        required: false
        default: ""
      mode:
        description: "delta (small, incremental) or base (rebuild everything)"
        required: false
        default: "delta"
      head:
        description: "Rows per wiki to map to a Wikidata item, on a base run (blank = 10000)"
        required: false
        default: ""

concurrency:
  group: wikipedia-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the rolling release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      # The stores are the state every run folds into: the decayed standings, the resolved Wikidata keys,
      # and the marker the delta chain is cut against.
      - name: Restore the wiki stores
        uses: actions/cache/restore@v6
        with:
          path: data/wikipedia
          key: wikipedia-store-${{ github.run_id }}
          restore-keys: wikipedia-store-

      - name: Test
        run: npm test

      - name: Sample the pageviews and fold them in
        env:
          DATE: ${{ inputs.date }}
        run: |
          DAY="${DATE:-$(date -u -d yesterday +%F)}"
          echo "sampling $DAY"
          node --max-old-space-size=8192 Scripts/fetch-wikipedia-views.mjs \
            --date="$DAY" --min-views=1 --keep=1000000 --out=data/wikipedia/views.ndjson
          node Scripts/fetch-wikipedia.mjs --min-views=1

      # Bounded per run, with the store cached between runs, so a band is keyed over a few days rather than
      # in one go: a million keys is millions of requests. A title with no key yet falls back to one derived
      # from its title, which is a valid identity, just not one another wiki shares.
      #
      # The script paces itself: a thousand titles a query, a query every four seconds, which is what keeps
      # a long run inside the endpoint's per-minute query-time budget.
      - name: Resolve Wikidata keys
        run: node --max-old-space-size=8192 Scripts/fetch-wiki-keys.mjs --limit=600000

      # The fold above runs before these keys exist, and a row's key decides its id, so this second pass is
      # what moves them into the store the build reads. The fold is incremental and a row whose id moved is
      # a changed row, so only the keyed rows are rewritten, each recording the id it used to have.
      - name: Fold the resolved keys in
        run: node Scripts/fetch-wikipedia.mjs --min-views=1

      - name: Decide delta vs base
        id: mode
        run: |
          # A base on Sundays, on request, or when there is no marker to cut a delta against — which is
          # what a cold cache looks like.
          MODE="${{ inputs.mode }}"
          if [ "$(date -u +%u)" = "7" ] || [ ! -f data/wikipedia/en/published.json ]; then
            MODE=base
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"

      - name: Build one index per wiki
        if: steps.mode.outputs.mode == 'base'
        run: |
          for lang in en de es; do
            node Scripts/build-index-wikipedia.mjs "$lang" --budget-mb=100
          done

      # Only a base run needs the entity map: it is keyed by row, and a delta does not move the base's rows.
      - name: Map the cross-language entities
        if: steps.mode.outputs.mode == 'base'
        env:
          HEAD: ${{ inputs.head }}
        run: |
          node --max-old-space-size=8192 Scripts/fetch-wiki-groups.mjs \
            --head "${HEAD:-10000}" --from en,de,es --delay 500 --write

      - name: Build the deltas
        if: steps.mode.outputs.mode == 'delta'
        run: |
          for lang in en de es; do
            node Scripts/build-wikipedia-delta.mjs "$lang" --mark
          done

      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "base" ]; then
            node Scripts/publish-wikipedia.mjs --base
          else
            node Scripts/publish-wikipedia.mjs
          fi

      - name: Save the wiki stores
        uses: actions/cache/save@v6
        with:
          path: data/wikipedia
          key: wikipedia-store-${{ github.run_id }}
